<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskLib</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .container {
            margin-top: 1cm;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        input[type="text"], input[type="date"], select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #f3c221;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            gap: 12px;
            height: 43px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #d4a610;
        }

        ul {
            list-style-type: none;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 15px;
            gap: 12px;
            margin-bottom: 12px;
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }

        li.completed {
            text-decoration: line-through;
            color: #888;
            border-radius: 15px;
            gap: 12px;
            margin-bottom: 12px;
        }

        li button {
            background-color: #dc3545;
            border: none;
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 35px;
            cursor: pointer;
            margin-left: 5px;
            transition: background-color 0.3s ease;
        }

        li button:hover {
            background-color: #c82333;
        }

        li.low {
            background-color: #9affb1;
        }

        li.medium {
            background-color: #ffe598;
        }

        li.high {
            background-color: #ffa3ab;
        }

        .dark-mode {
            background-color: #333;
            color: #b1b1b1;
        }

        .dark-mode .container {
            background-color: #444;
        }

        .dark-mode .input-container {
            background-color: #222;
            color: #b1b1b1;
        }

        .dark-mode button {
            background-color: #e7b40c;
        }

        .dark-mode .delete-task {
            background-color: red;
        }

        .delete-task {
            background-color: red;
        }

        .dark-mode button:hover {
            background-color: #d4a610;
        }

        .switch {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 35px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 35px;
        }

        input:checked + .slider {
            background-color: #006eff;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                margin-top: 365px;
                max-width: 94%;
            }

            li {
                flex-direction: column;
                align-items: flex-start;
            }

            li button {
                margin-left: 0;
                margin-top: 5px;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            button {
                padding: 8px 16px;
            }

            input[type="text"], input[type="date"], select, button {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="switch">
        <label>
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="container">
        <h1>Tasklib - Task Manager</h1>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <input type="date" id="dueDateInput">
            <select id="priorityInput">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="filter-buttons">
            <button onclick="addTask()">Add Task</button>
            <button onclick="filterTasks('all')">All</button>
            <button onclick="filterTasks('completed')">Completed</button>
            <button onclick="filterTasks('pending')">Pending</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();

            const darkModeToggle = document.getElementById('darkModeToggle');
            darkModeToggle.addEventListener('change', toggleDarkMode);
        });

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const dueDateInput = document.getElementById('dueDateInput');
            const priorityInput = document.getElementById('priorityInput');
            const taskList = document.getElementById('taskList');

            if (taskInput.value.trim() !== '') {
                const task = {
                    id: Date.now(),
                    text: taskInput.value,
                    dueDate: dueDateInput.value,
                    priority: priorityInput.value,
                    completed: false
                };
                addTaskToDOM(task);
                saveTaskToLocalStorage(task);
                taskInput.value = '';
                dueDateInput.value = '';
                priorityInput.value = 'low';
            }
        }

        function addTaskToDOM(task) {
            const taskList = document.getElementById('taskList');
            const li = document.createElement('li');
            li.className = task.priority;
            li.innerHTML = `
                <span onclick="toggleTaskCompletion(${task.id})">${task.text} - ${task.dueDate} - ${task.priority}</span>
                <div>
                    <button class="delete-task" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            `;
            li.classList.toggle('completed', task.completed);
            li.id = `task-${task.id}`;
            taskList.appendChild(li);
        }

        function toggleTaskCompletion(taskId) {
            const task = getTaskFromLocalStorage(taskId);
            task.completed = !task.completed;
            updateTaskInLocalStorage(task);
            document.getElementById(`task-${task.id}`).classList.toggle('completed', task.completed);
        }

        function deleteTask(taskId) {
            document.getElementById(`task-${taskId}`).remove();
            deleteTaskFromLocalStorage(taskId);
        }

        function filterTasks(filter) {
            const tasks = getTasksFromLocalStorage();
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            tasks.filter(task => {
                if (filter === 'all') return true;
                return filter === 'completed' ? task.completed : !task.completed;
            }).forEach(task => addTaskToDOM(task));
        }

        function saveTaskToLocalStorage(task) {
            const tasks = getTasksFromLocalStorage();
            tasks.push(task);
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function getTasksFromLocalStorage() {
            return JSON.parse(localStorage.getItem('tasks')) || [];
        }

        function getTaskFromLocalStorage(taskId) {
            const tasks = getTasksFromLocalStorage();
            return tasks.find(task => task.id === taskId);
        }

        function updateTaskInLocalStorage(updatedTask) {
            let tasks = getTasksFromLocalStorage();
            tasks = tasks.map(task => task.id === updatedTask.id ? updatedTask : task);
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function deleteTaskFromLocalStorage(taskId) {
            const tasks = getTasksFromLocalStorage();
            const updatedTasks = tasks.filter(task => task.id !== taskId);
            localStorage.setItem('tasks', JSON.stringify(updatedTasks));
        }

        function loadTasks() {
            const tasks = getTasksFromLocalStorage();
            tasks.forEach(task => addTaskToDOM(task));
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const container = document.querySelector('.container');
            container.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
